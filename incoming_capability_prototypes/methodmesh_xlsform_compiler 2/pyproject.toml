[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "methodmesh-xlsform"
version = "0.1.0"
description = "Compile ordinary ODK XLSForms into MethodMesh-authenticated and attested release forms"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1,<4"]
license = {text = "Apache-2.0"}
authors = [{name = "MethodMesh project"}]

[project.scripts]
mmxls = "methodmesh_xlsform.cli:main"

[tool.setuptools.packages.find]
include = ["methodmesh_xlsform*"]
