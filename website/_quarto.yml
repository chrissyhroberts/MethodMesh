project:
  type: website
  output-dir: ../docs
  resources:
    - assets/**
    - reference/source-docs/**

website:
  title: "MethodMesh"
  search:
    location: sidebar
    type: overlay
  page-navigation: true
  bread-crumbs: true
  repo-url: https://github.com/chrissyhroberts/MethodMesh
  repo-branch: master
  repo-actions: [edit, issue]
  navbar:
    left:
      - text: "Guide"
        href: index.qmd
      - text: "Capabilities"
        href: reference/modules/index.qmd
      - text: "ODK forms"
        href: reference/forms.qmd
      - text: "Architecture"
        href: system/capability-contract.qmd
    right:
      - icon: github
        href: https://github.com/chrissyhroberts/MethodMesh
  sidebar:
    style: docked
    collapse-level: 2
    contents:
      - index.qmd
      - getting-started.qmd
      - installation.qmd
      - section: "System model"
        contents:
          - system/index.qmd
          - system/surfaces.qmd
          - system/capability-contract.qmd
          - system/native-lifecycle.qmd
          - system/output-contract.qmd
      - section: "Composition & workflows"
        contents:
          - workflows/presets-protocols.qmd
          - workflows/schedules-widgets.qmd
          - workflows/odk-xlsform.qmd
      - section: "Operations"
        contents:
          - operations/offline-online.qmd
          - operations/devices-hardware.qmd
          - operations/settings-services.qmd
      - section: "Current reference library"
        contents:
          - reference/modules/index.qmd
          - reference/methods.qmd
          - reference/forms.qmd
          - reference/production-status.qmd
          - reference/ril.qmd
          - reference/architecture.qmd
          - reference/known-gaps.qmd
          - reference/master-book.qmd
      - section: "Development"
        contents:
          - development/module-authoring.qmd
          - development/documentation.qmd
          - development/testing-release.qmd
      - troubleshooting.qmd

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: true
    anchor-sections: true
    smooth-scroll: true
    include-after-body: assets/reference-filter.html
